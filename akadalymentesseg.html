<script>
(function () {
  var KEY = "bukva-private-key", T = JSON.parse(document.getElementById("pv-text").textContent);
  var root = document.documentElement, form = document.getElementById("pv-form"),
      input = document.getElementById("pv-pw"), err = document.getElementById("pv-error"),
      errText = document.getElementById("pv-error-text"), btn = document.getElementById("pv-submit"),
      remember = document.getElementById("pv-remember"), toggle = document.getElementById("pv-toggle");
  var SALT = root.getAttribute("data-salt"), IT = +root.getAttribute("data-it");
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function enc(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(k, v) { try { v === null ? (localStorage.removeItem(KEY), sessionStorage.removeItem(KEY)) : k.setItem(KEY, v); } catch (e) {} }
  function stored() { try { return localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) { return null; } }

  function decrypt(raw) {
    var buf = b64(document.getElementById("pv-payload").textContent.trim());
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12)); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function (k) { return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(SALT), iterations: IT }, k, 256); })
      .then(function (bits) { return new Uint8Array(bits); });
  }
  function show(page) {
    // document.open() is ignored while this page is still parsing, so wait for it to finish.
    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", function () { show(page); }); return; }
    var hash = location.hash;
    document.open(); document.write(page); document.close();
    if (hash) setTimeout(function () { var t = document.getElementById(decodeURIComponent(hash.slice(1))); if (t) t.scrollIntoView(); }, 50);
  }
  function fail(msg) {
    root.classList.remove("pv-checking");
    errText.textContent = msg; err.hidden = false;
    input.setAttribute("aria-invalid", "true"); input.setAttribute("aria-describedby", "pv-error");
    btn.removeAttribute("aria-disabled"); btn.textContent = T.submit; form.removeAttribute("aria-busy");
    input.focus(); input.select();
  }

  if (!window.crypto || !crypto.subtle) { root.classList.remove("pv-checking"); fail(T.unsupported); return; }

  // Already unlocked earlier in this tab/device: open the page straight away.
  var saved = stored();
  if (saved && saved.indexOf(SALT + ":") === 0) {
    decrypt(b64(saved.slice(SALT.length + 1))).then(show, function () { store(null, null); root.classList.remove("pv-checking"); });
  } else {
    root.classList.remove("pv-checking");
    input.focus();
  }

  toggle.addEventListener("click", function () {
    var on = toggle.getAttribute("aria-pressed") !== "true";
    toggle.setAttribute("aria-pressed", on); input.type = on ? "text" : "password";
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (form.getAttribute("aria-busy") === "true") return;
    if (!input.value) { fail(T.empty); return; }
    err.hidden = true; input.removeAttribute("aria-invalid"); input.removeAttribute("aria-describedby");
    form.setAttribute("aria-busy", "true"); btn.setAttribute("aria-disabled", "true"); btn.textContent = T.busy;
    var raw;
    derive(input.value)
      .then(function (k) { raw = k; return decrypt(k); })

        store(null, null);
        store(remember.checked ? localStorage : sessionStorage, SALT + ":" + enc(raw));
        show(page);
      }, function () { fail(T.error); });
  });
})();
